<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Paper / custom UI example</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #17231f;
      color: #f4ead5;
      font: 15px system-ui;
    }
    main {
      max-width: 1400px;
      margin: auto;
      padding: 40px;
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 35px;
    }
    h1 {
      font:
        48px Georgia,
        serif;
      font-weight: 400;
    }
    p {
      line-height: 1.7;
      color: #b5c2b6;
    }
    #card {
      height: 75vh;
      min-height: 350px;
      --card-focus: #e5c47c;
      --card-shadow: #000;
    }
    nav {
      display: grid;
      gap: 8px;
    }
    button {
      font: inherit;
      cursor: pointer;
      background: transparent;
      color: inherit;
      border: 1px solid #617569;
      padding: 12px;
      text-align: left;
    }
    button[aria-pressed="true"] {
      background: #e5c47c;
      color: #17231f;
    }
    #message {
      min-height: 60px;
    }
    output {
      color: #e5c47c;
    }
    a {
      color: inherit;
    }
    @media (max-width: 700px) {
      main {
        padding: 22px;
        grid-template-columns: 1fr;
      }
      h1 {
        margin: 0;
      }
      #card {
        height: 45vh;
        order: -1;
      }
      nav {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
  <main>
    <aside>
      <p>01 / PAPER EXPERIMENT</p>
      <h1>Leave a mark.</h1>
      <p>
        This page supplies all controls and styling. The imported card supplies
        only the interactive material.
      </p>
      <nav aria-label="Paper tools">
        <button data-tool="rotate" aria-pressed="true">Explore</button
        ><button data-tool="water" aria-pressed="false">Add water</button
        ><button data-tool="burn" aria-pressed="false">Apply heat</button
        ><button data-tool="crease" aria-pressed="false">Make a fold</button
        ><button id="dry">Let it dry</button
        ><button id="fresh">Start again</button
        ><button id="flip">Other side</button
        ><button id="close">Look closer</button>
      </nav>
      <p>
        Choose a tool, then press on the paper. Hold to apply more. Drag in
        Explore to rotate.
      </p>
      <output id="state">Preparing paper…</output>
      <p id="message" role="status"></p>
      <a href="../index.html">Original demo</a>
    </aside>
    <div id="card"></div>
  </main>
  <script type="module">
    import { createMaterialCard } from "../src/material-card.js";
    const container = document.querySelector("#card");
    container.addEventListener(
      "cardstatus",
      (e) =>
        (document.querySelector("#message").textContent = e.detail.message),
    );
    container.addEventListener("cardstatechange", (e) => {
      const s = e.detail;
      document.querySelector("#state").textContent =
        `Moisture ${Math.round(s.wet * 100)}% / Char ${Math.round(s.char * 100)}%`;
      document
        .querySelectorAll("[data-tool]")
        .forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.tool === s.tool)),
        );
    });
    try {
      const card = await createMaterialCard(container);
      document.querySelector("#state").textContent = "Ready to explore";
      document
        .querySelectorAll("[data-tool]")
        .forEach((b) => (b.onclick = () => card.setTool(b.dataset.tool)));
      document.querySelector("#dry").onclick = () => card.dry();
      document.querySelector("#fresh").onclick = () => card.fresh();
      document.querySelector("#flip").onclick = () => card.flip();
      document.querySelector("#close").onclick = () =>
        card.inspect(!card.getState().inspecting);
      // On route teardown: card.destroy();
    } catch (error) {
      document.querySelector("#message").textContent = error.message;
    }
  </script>
</html>
